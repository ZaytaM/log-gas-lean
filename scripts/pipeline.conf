# pipeline.conf — the only file to edit when adjusting the run. Sourced by pipeline.sh.

# Models. Workers stay low-tier; the advisor is used sparingly (see ADVISOR_* below).
# Check `claude --help` for accepted --model values; full API ids also work.
MODEL_ORCH=claude-fable-5-1
MODEL_WORKER=claude-fable-5-1
MODEL_REPORTER=haiku
MODEL_ADVISOR=claude-fable-5-1
# Used when the primary model's call fails for quota or rate-limit reasons.
MODEL_WORKER_FALLBACK=opus
MODEL_ORCH_FALLBACK=opus

# Workers
MAX_WORKERS=24          # concurrent; halved automatically when load > LOAD_HALVE_ABOVE
MAX_ATTEMPTS=15         # proof attempts per worker per night
MAX_TURNS=80            # Claude Code tool turns per worker (hard stop)
WORKER_TIMEOUT=1500     # seconds per worker (25 min)
LOAD_HALVE_ABOVE=50

# Money. Workers keep going on a lemma night after night as long as the night's
# total stays under this cap; nothing waits for human approval.
NIGHT_COST_CAP_USD=999

# Advisor (Fable): only after a lemma has been open this many nights, at most
# this many lemmas per night, and not again for the same lemma within the cooldown.
ADVISOR_AFTER_NIGHTS=5
ADVISOR_MAX_PER_NIGHT=0
ADVISOR_COOLDOWN_DAYS=7

# Session-allowance leeway. Claude Code has no headless readout of the plan's 5-hour or
# weekly utilization (only the interactive /usage and status line show it), so the run
# budgets by cost at list price instead. If SESSION_LIMIT_USD is set, the night's budget
# becomes min(NIGHT_COST_CAP_USD, SESSION_LIMIT_FRACTION * SESSION_LIMIT_USD). Workers still
# running are counted at the mean cost of finished ones (WORKER_COST_EST_USD before any
# finish), so the gate stops launching before the money is actually spent.
# Calibrating SESSION_LIMIT_USD: after a night with little other use, if the run spent $X
# (cost_usd_tonight in the report) and /usage then shows Y% of the session limit, the
# allowance is about X/(Y/100). A hit limit is also logged in state/limit_hits.tsv with the
# cost reached, which is a direct measurement when the pipeline was the only consumer.
# Your own interactive use shares the same allowance and is invisible to the script.
SESSION_LIMIT_USD=
SESSION_LIMIT_FRACTION=0.9
WORKER_COST_EST_USD=3
