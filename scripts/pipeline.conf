# pipeline.conf — the only file to edit when adjusting the run. Sourced by pipeline.sh.

# Models. Workers stay low-tier; the advisor is used sparingly (see ADVISOR_* below).
# Check `claude --help` for accepted --model values; full API ids also work.
MODEL_ORCH=opus
MODEL_WORKER=sonnet
MODEL_REPORTER=haiku
MODEL_ADVISOR=claude-fable-5-1
# Optional fallback models; blank means stop rather than retry another model.
MODEL_WORKER_FALLBACK=
MODEL_ORCH_FALLBACK=

# Persistent workers: continuously process the queue across allowance resets.
MAX_WORKERS=6           # maximum 6; lower concurrency when machine load is high
MAX_ATTEMPTS=5          # proof attempts in each worker invocation
MAX_TURNS=20            # checkpoint and requeue after this model turn limit
WORKER_TIMEOUT=600      # per invocation; partial work is retained
BUILD_TIMEOUT=1800
LOAD_HALVE_ABOVE=50

# No routine total-task or estimated-dollar stopping budget.
# Usage is recorded for tuning; real allowance limits cause automatic waiting.

# Advisor (Fable): only after a lemma has been open this many nights, at most
# this many lemmas per night, and not again for the same lemma within the cooldown.
ADVISOR_AFTER_NIGHTS=5
ADVISOR_MAX_PER_NIGHT=0
ADVISOR_COOLDOWN_DAYS=7

# Subscription calibration: the author's afternoon trial used about 5% for $1.61
# in client-side estimated cost. This is an observation, never a stopping gate.

# Finish the repaired analytic chain first when its tasks are ready.
PRIORITY_MODULES="LogGas.Decoupling LogGas.Grouped"
